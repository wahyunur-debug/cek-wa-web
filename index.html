<script>
async function processFile() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return alert("Upload file dulu!");

    const reader = new FileReader();

    reader.onload = async function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        document.getElementById("status").innerText = "⏳ Processing...";

        for (let i = 0; i < json.length; i++) {
            let raw = json[i]["NO TELP"];

            if (!raw) {
                json[i]["KETERANGAN"] = "KOSONG";
                json[i]["WA"] = "INVALID";
                continue;
            }

            // 🔧 NORMALISASI NOMOR
            let nomor = raw.toString().replace(/\D/g, "");

            if (nomor.startsWith("0")) {
                nomor = "62" + nomor.slice(1);
            }

            // ❌ VALIDASI DASAR
            if (!nomor.startsWith("62") || nomor.length < 10) {
                json[i]["KETERANGAN"] = "FORMAT SALAH";
                json[i]["WA"] = "INVALID";
                continue;
            }

            try {
                let res = await fetch("https://wa-backend-production-da05.up.railway.app/cek", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ nomor })
                });

                let dataRes = await res.json();

                // 🔥 DOUBLE VALIDASI
                if (!dataRes || dataRes.registered === undefined) {
                    json[i]["KETERANGAN"] = "API ERROR";
                    json[i]["WA"] = "TIDAK VALID";
                } else if (dataRes.registered === true) {
                    json[i]["KETERANGAN"] = "AKTIF";
                    json[i]["WA"] = "TERDAFTAR";
                } else {
                    json[i]["KETERANGAN"] = "AKTIF";
                    json[i]["WA"] = "TIDAK TERDAFTAR";
                }

            } catch (e) {
                json[i]["KETERANGAN"] = "ERROR";
                json[i]["WA"] = "GAGAL CEK";
            }
        }

        const newSheet = XLSX.utils.json_to_sheet(json);
        const newBook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newBook, newSheet, "HASIL");

        XLSX.writeFile(newBook, "hasil_cek_pro.xlsx");

        document.getElementById("status").innerText = "✅ Selesai!";
    };

    reader.readAsArrayBuffer(file);
}
</script>
