<!DOCTYPE html>
<html>
<head>
  <title>WA Checker Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 30px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
    }

    h2 {
      text-align: center;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn {
      background: #22c55e;
      color: white;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    td, th {
      padding: 10px;
      border-bottom: 1px solid #334155;
    }

    .ok { color: #22c55e; }
    .no { color: red; }
  </style>
</head>
<body>

<div class="card">
  <h2>📱 WA Checker Pro</h2>

  <input type="file" id="file" />
  <br>
  <button class="btn" onclick="proses()">Mulai Cek</button>
  <button class="btn" onclick="download()">Download Excel</button>

  <table id="tabel">
    <thead>
      <tr>
        <th>No</th>
        <th>Nomor</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
let hasil = [];

async function proses() {
  const file = document.getElementById("file").files[0];

  if (!file) return alert("Upload file dulu!");

  const data = await file.arrayBuffer();
  const workbook = XLSX.read(data);
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(sheet);

  const tbody = document.querySelector("#tabel tbody");
  tbody.innerHTML = "";
  hasil = [];

  for (let i = 0; i < json.length; i++) {
    let nomor = json[i].nomor || json[i].Nomor || Object.values(json[i])[0];

    const res = await fetch("https://WAJIB-GANTI-INI.up.railway.app/cek", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ nomor })
    });

    const dataRes = await res.json();

    hasil.push({
      nomor,
      status: dataRes.status
    });

    tbody.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td>${nomor}</td>
        <td class="${dataRes.status === 'TERDAFTAR' ? 'ok' : 'no'}">
          ${dataRes.status}
        </td>
      </tr>
    `;
  }
}

function download() {
  if (hasil.length === 0) return alert("Belum ada data!");

  const ws = XLSX.utils.json_to_sheet(hasil);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Hasil");

  XLSX.writeFile(wb, "hasil_cek.xlsx");
}
</script>

</body>
</html>
