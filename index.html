<!DOCTYPE html>
<html>
<head>
  <title>CEK NOMOR WA</title>
</head>
<body>

<h2>Upload Excel Nomor WA</h2>
<input type="file" id="file" />
<button onclick="proses()">PROSES</button>

<pre id="hasil"></pre>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
const API_URL = "https://URL-BACKEND-LU/cek"; // GANTI

async function proses() {
  const file = document.getElementById("file").files[0];
  const reader = new FileReader();

  reader.onload = async function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: "array" });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    let hasil = [];

    for (let row of json) {
      const nomor = row["NO TELP"];

      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nomor })
      });

      const dataRes = await res.json();

      hasil.push({
        nomor: dataRes.nomor,
        status: dataRes.registered ? "AKTIF" : "TIDAK TERDAFTAR"
      });
    }

    document.getElementById("hasil").textContent =
      JSON.stringify(hasil, null, 2);
  };

  reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
