<script>
const API = "https://wa-backend-production-b88a.up.railway.app/cek";

let hasil = [];

async function mulai() {
  const file = document.getElementById("file").files[0];

  if (!file) {
    alert("Upload file dulu!");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";
    hasil = [];

    let no = 1;

    for (let row of json) {
      let nomor = row["NO TELP"] || "";

      if (!nomor) continue;

      document.getElementById("progress").innerText =
        `Proses ${no} / ${json.length}`;

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ nomor })
        });

        const data = await res.json();

        console.log("RESP:", data);

        let ket = data.keterangan || "TIDAK AKTIF";
        let wa = data.wa || "TIDAK TERDAFTAR";

        hasil.push({
          "NO": no,
          "NO TELP": nomor,
          "KETERANGAN": ket,
          "WA": wa
        });

        tbody.innerHTML += `
          <tr>
            <td>${no}</td>
            <td>${nomor}</td>
            <td style="color:${ket==='AKTIF'?'#00ff9d':'#ff4d4d'}">${ket}</td>
            <td style="color:${wa==='TERDAFTAR'?'#00ff9d':'#ff4d4d'}">${wa}</td>
          </tr>
        `;

      } catch (err) {
        console.log("ERROR:", err);

        tbody.innerHTML += `
          <tr>
            <td>${no}</td>
            <td>${nomor}</td>
            <td style="color:red">ERROR</td>
            <td style="color:red">ERROR</td>
          </tr>
        `;
      }

      no++;
      await new Promise(r => setTimeout(r, 800));
    }

    document.getElementById("progress").innerText = "Selesai ✅";
  };

  reader.readAsArrayBuffer(file);
}
</script>
