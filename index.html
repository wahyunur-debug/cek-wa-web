<!DOCTYPE html>
<html>
<head>
  <title>WA Checker Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 40px;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    input, button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin: 5px;
    }

    button {
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    .aktif { color: #22c55e; font-weight: bold; }
    .tidak { color: #ef4444; font-weight: bold; }

    .progress {
      margin-top: 10px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📊 WA Checker Pro</h1>

  <input type="file" id="file" />
  <br>
  <button onclick="mulai()">Mulai Cek</button>
  <button onclick="downloadExcel()">Download Excel</button>

  <div class="progress" id="progress"></div>

  <table id="table">
    <thead>
      <tr>
        <th>No</th>
        <th>No Telp</th>
        <th>Keterangan</th>
        <th>WA</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const API = "https://NAMA-BACKEND.up.railway.app/cek"; // GANTI INI

let hasil = [];

async function mulai() {
  const file = document.getElementById("file").files[0];

  if (!file) {
    alert("Upload file dulu!");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";
    hasil = [];

    let no = 1;

    for (let row of json) {
      let nomor = row["NO TELP"] || "";

      if (!nomor) continue;

      document.getElementById("progress").innerText =
        `Proses ${no} / ${json.length}`;

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ nomor })
        });

        const data = await res.json();

        let ket = data.keterangan || "ERROR";
        let wa = data.wa || "ERROR";

        hasil.push({
          "NO": no,
          "NO TELP": nomor,
          "KETERANGAN": ket,
          "WA": wa
        });

        tbody.innerHTML += `
          <tr>
            <td>${no}</td>
            <td>${nomor}</td>
            <td class="${ket === 'AKTIF' ? 'aktif' : 'tidak'}">${ket}</td>
            <td class="${wa === 'TERDAFTAR' ? 'aktif' : 'tidak'}">${wa}</td>
          </tr>
        `;

      } catch (e) {
        hasil.push({
          "NO": no,
          "NO TELP": nomor,
          "KETERANGAN": "ERROR",
          "WA": "ERROR"
        });

        tbody.innerHTML += `
          <tr>
            <td>${no}</td>
            <td>${nomor}</td>
            <td class="tidak">ERROR</td>
            <td class="tidak">ERROR</td>
          </tr>
        `;
      }

      no++;
      await new Promise(r => setTimeout(r, 800)); // anti limit
    }

    document.getElementById("progress").innerText = "Selesai ✅";
  };

  reader.readAsArrayBuffer(file);
}

function downloadExcel() {
  if (hasil.length === 0) {
    alert("Belum ada hasil!");
    return;
  }

  const ws = XLSX.utils.json_to_sheet(hasil);

  // AUTO WIDTH
  ws['!cols'] = [
    { wch: 5 },
    { wch: 20 },
    { wch: 20 },
    { wch: 20 }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Hasil");

  XLSX.writeFile(wb, "hasil_cek_wa.xlsx");
}
</script>

</body>
</html>
