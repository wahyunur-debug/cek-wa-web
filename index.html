<!DOCTYPE html>
<html>
<head>
  <title>WA Checker Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 40px;
    }

    h2 {
      text-align: center;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
    }

    input, button {
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
      text-align: left;
    }

    .aktif {
      color: #22c55e;
      font-weight: bold;
    }

    .tidak {
      color: #ef4444;
      font-weight: bold;
    }

    #progress {
      margin-top: 10px;
    }

  </style>
</head>
<body>

<div class="card">
  <h2>📱 WA Checker Pro</h2>

  <input type="file" id="file">
  <br>
  <button onclick="proses()">Mulai Cek</button>
  <button onclick="downloadExcel()">Download Excel</button>

  <div id="progress"></div>

  <table id="table">
    <thead>
      <tr>
        <th>No</th>
        <th>Nomor</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const API_URL = "https://ISI_URL_BACKEND_KAMU/cek";

let hasilGlobal = [];

async function proses() {
  const file = document.getElementById("file").files[0];

  if (!file) {
    alert("Upload file dulu!");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: "array" });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";

    hasilGlobal = [];

    let total = json.length;
    let count = 0;

    for (let row of json) {
      const nomor = row["NO TELP"];
      if (!nomor) continue;

      count++;

      document.getElementById("progress").innerText =
        `Processing ${count} / ${total}`;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nomor })
        });

        const dataRes = await res.json();

        const status = dataRes.registered ? "AKTIF" : "TIDAK";

        hasilGlobal.push({
          nomor: dataRes.nomor,
          status
        });

        const tr = `
          <tr>
            <td>${count}</td>
            <td>${dataRes.nomor}</td>
            <td class="${status === "AKTIF" ? "aktif" : "tidak"}">
              ${status}
            </td>
          </tr>
        `;

        tbody.innerHTML += tr;

      } catch {
        tbody.innerHTML += `
          <tr>
            <td>${count}</td>
            <td>${nomor}</td>
            <td class="tidak">ERROR</td>
          </tr>
        `;
      }
    }

    document.getElementById("progress").innerText = "Selesai ✅";
  };

  reader.readAsArrayBuffer(file);
}

function downloadExcel() {
  if (hasilGlobal.length === 0) {
    alert("Belum ada data!");
    return;
  }

  const ws = XLSX.utils.json_to_sheet(hasilGlobal);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Hasil");

  XLSX.writeFile(wb, "hasil_cek_wa.xlsx");
}
</script>

</body>
</html>
