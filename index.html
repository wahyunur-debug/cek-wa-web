<!DOCTYPE html>
<html>
<head>
  <title>WA Number Checker</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #16a34a;
    }

    #progress {
      margin-top: 15px;
    }

    pre {
      text-align: left;
      background: #020617;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      max-height: 300px;
      overflow: auto;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📱 WA Number Checker</h2>

  <input type="file" id="file" />
  <br>
  <button onclick="proses()">Mulai Cek</button>

  <div id="progress"></div>
  <pre id="hasil"></pre>
</div>

<script>
const API_URL = "https://ISI_URL_BACKEND_KAMU/cek";

async function proses() {
  const file = document.getElementById("file").files[0];

  if (!file) {
    alert("Upload file dulu!");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: "array" });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    let hasil = [];
    let total = json.length;
    let count = 0;

    for (let row of json) {
      const nomor = row["NO TELP"];
      if (!nomor) continue;

      count++;

      document.getElementById("progress").innerText =
        `Processing ${count} / ${total}`;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nomor })
        });

        const dataRes = await res.json();

        hasil.push({
          nomor: dataRes.nomor,
          status: dataRes.registered ? "AKTIF" : "TIDAK"
        });

      } catch {
        hasil.push({ nomor, status: "ERROR" });
      }
    }

    document.getElementById("hasil").textContent =
      JSON.stringify(hasil, null, 2);
  };

  reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
